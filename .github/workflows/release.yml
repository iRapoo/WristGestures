# Builds a signed release APK and publishes it on the GitHub Releases page.
#
# How to publish a new version:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# One-time setup (Settings → Secrets and variables → Actions → New repository secret):
#   SIGNING_KEYSTORE_BASE64    release keystore encoded with base64
#   SIGNING_KEYSTORE_PASSWORD  keystore password
#   SIGNING_KEY_ALIAS          key alias
#   SIGNING_KEY_PASSWORD       key password
# See "Выпуск релиза" in README.md (English: "Publishing a release" in README.en.md).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        id: version
        run: |
          # v1.2.3 -> versionName 1.2.3, versionCode 10203
          NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set. See README → Publishing a release."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk \
            "WristGestures-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: WristGestures-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
